name: Deploy to Stage

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 550933156245.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER: hari328-stage
  PROJECT: hari328-stage

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-stage

    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy

      # --- Posts Service (with DB migration) ---

      - name: Download posts-service task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.PROJECT }}-posts-service \
            --query taskDefinition \
            > posts-task-def.json

      - name: Render posts-service image
        id: render-posts
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: posts-task-def.json
          container-name: posts-service
          image: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}-posts-service:${{ inputs.image_tag }}

      - name: Deploy posts-service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-posts.outputs.task-definition }}
          service: ${{ env.PROJECT }}-posts-service
          cluster: ${{ env.CLUSTER }}
          force-new-deployment: true
          wait-for-service-stability: true
          run-task: true
          wait-for-task-stopped: true
          run-task-container-overrides: >-
            [{"name":"posts-service","command":["sh","-c","mkdir -p /root/.local/share && npm run db:migrate --workspace=@repo/database"]}]
          run-task-capacity-provider-strategy: >-
            [{"capacityProvider":"ec2-ondemand","weight":1}]

      # --- Recommender Service ---

      - name: Download recommender-service task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.PROJECT }}-recommender-service \
            --query taskDefinition \
            > recommender-task-def.json

      - name: Render recommender-service image
        id: render-recommender
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: recommender-task-def.json
          container-name: recommender-service
          image: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}-recommender-service:${{ inputs.image_tag }}

      - name: Deploy recommender-service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-recommender.outputs.task-definition }}
          service: ${{ env.PROJECT }}-recommender-service
          cluster: ${{ env.CLUSTER }}
          force-new-deployment: true
          wait-for-service-stability: true

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image Tag | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| posts-service | \`${{ inputs.image_tag }}\` | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| recommender-service | \`${{ inputs.image_tag }}\` | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
